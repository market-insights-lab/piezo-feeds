name: Daily harvest

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest tenders and patents
        env:
          OWN_GROUP: ${{ secrets.OWN_GROUP }}
        run: |
          mkdir -p data feeds
          python harvest.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data feeds
          git diff --cached --quiet || git commit -m "Daily harvest $(date -u +%F)"
          git push
